# Pembaruan otomatis dependency & GitHub Actions (mingguan) supaya selalu versi terbaru yang aman.
version: 2
updates:
  - package-ecosystem: npm
    directory: /bot
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
